# Validation du dépôt dans Azure Pipelines : mêmes étapes que GitHub Actions.
# Avec Azure Repos, la validation des PR se configure par une stratégie de branche
# (Branch policies > Build validation) qui pointe vers ce pipeline.
# Aucun artefact publié, aucun déploiement.

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - "*"

pool:
  vmImage: ubuntu-24.04

variables:
  # Docker sur les agents hébergés; LintSeulement pour un agent auto-hébergé sans Docker.
  - name: modeValidation
    value: Docker

steps:
  - checkout: self

  - task: UsePythonVersion@0
    displayName: Installer Python
    inputs:
      versionSpec: "3.12"

  - script: |
      curl -fsSL https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb -o /tmp/packages-microsoft-prod.deb
      sudo dpkg -i /tmp/packages-microsoft-prod.deb
      sudo apt-get update -qq
      sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18
    displayName: Installer ODBC Driver 18
    condition: eq(variables['modeValidation'], 'Docker')

  - script: pip install -r requirements-dev.txt
    displayName: Installer les dépendances Python (versions épinglées)

  - pwsh: ./scripts/valider.ps1 -Mode $(modeValidation)
    displayName: Valider (lint, personnalisations, hook, skills, Flyway, SQL et Python)

# Validation du dépôt : même script qu'en local et que dans Azure Pipelines.
# Aucun artefact, aucun secret, aucun déploiement.
name: Validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  valider:
    name: valider.ps1 (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installer sqlfluff (version épinglée)
        run: pip install -r requirements-dev.txt

      - name: Valider (lint, personnalisations, hook, skills, Flyway, tests SQL)
        shell: pwsh
        run: ./scripts/valider.ps1 -Mode Docker
